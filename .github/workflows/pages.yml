name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Website entpacken
        run: |
          rm -rf site
          mkdir site
          unzip -o ll-solution-website-v6-fix.zip -d site

      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v5

      - name: Website vorbereiten
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
